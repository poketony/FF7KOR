name: Build first Korean glyph POC patcher

on:
  workflow_dispatch:
  push:
    paths:
      - "codex-lab/poc_runtime_patch/**"
      - "codex-lab/resources/korean_font/**"
      - "codex-lab/generated/korean_mapping.json"
      - "codex-lab/findings/poc_patch_sites.csv"
      - "codex-lab/findings/first_korean_glyph_test_vector.md"
      - ".github/workflows/build-c0-poc-patcher.yml"
  pull_request:
    paths:
      - "codex-lab/poc_runtime_patch/**"
      - "codex-lab/resources/korean_font/**"
      - "codex-lab/generated/korean_mapping.json"
      - "codex-lab/findings/poc_patch_sites.csv"
      - "codex-lab/findings/first_korean_glyph_test_vector.md"
      - ".github/workflows/build-c0-poc-patcher.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Korean TEX resource
        shell: pwsh
        run: |
          python codex-lab/resources/korean_font/build_tex_from_png.py

      - name: Verify Korean mapping and font package
        shell: pwsh
        run: |
          python codex-lab/poc_runtime_patch/verify_first_korean_glyph_package.py

      - name: Build x64 Release patcher
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )

          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio with MSVC x64 tools was not found.
            exit /b 1
          )

          if exist "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" (
            call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          ) else (
            call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          )
          if errorlevel 1 exit /b %errorlevel%

          where cl
          where link
          call codex-lab\poc_runtime_patch\build_msvc_x64.bat

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "codex-lab/poc_runtime_patch/c0_poc_patcher.exe"
          if (!(Test-Path $exe)) {
            throw "Expected executable was not produced: $exe"
          }
          $item = Get-Item $exe
          if ($item.Length -le 0) {
            throw "Expected executable has zero size: $exe"
          }
          Write-Host "Verified $exe ($($item.Length) bytes)"

      - name: Stage artifact files
        shell: pwsh
        run: |
          $stage = "artifact/ff7-2026-first-korean-glyph-poc-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/resources/korean_font" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/findings" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/generated" | Out-Null

          Copy-Item "codex-lab/poc_runtime_patch/c0_poc_patcher.exe" $stage
          Copy-Item "codex-lab/poc_runtime_patch/README.md" $stage
          Copy-Item "codex-lab/resources/korean_font/korean_c0_page.tim" "$stage/resources/korean_font/"
          Copy-Item "codex-lab/resources/korean_font/korean_c0_page.tex" "$stage/resources/korean_font/"
          Copy-Item "codex-lab/resources/korean_font/korean_c0_page.png" "$stage/resources/korean_font/"
          Copy-Item "codex-lab/resources/korean_font/korean_c0_page_preview.png" "$stage/resources/korean_font/"
          Copy-Item "codex-lab/resources/korean_font/selected_glyph_ga_c021.png" "$stage/resources/korean_font/"
          Copy-Item "codex-lab/resources/korean_font/korean_c0_manifest.json" "$stage/resources/korean_font/"
          Copy-Item "codex-lab/generated/korean_mapping.json" "$stage/generated/"
          if (Test-Path "codex-lab/findings/poc_patch_sites.csv") {
            Copy-Item "codex-lab/findings/poc_patch_sites.csv" "$stage/findings/"
          }
          if (Test-Path "codex-lab/findings/first_korean_glyph_test_vector.md") {
            Copy-Item "codex-lab/findings/first_korean_glyph_test_vector.md" "$stage/findings/"
          }
          if (Test-Path "codex-lab/findings/existing_korean_font_mapping.csv") {
            Copy-Item "codex-lab/findings/existing_korean_font_mapping.csv" "$stage/findings/"
          }

          $timestamp = (Get-Date).ToUniversalTime().ToString("o")
          @(
            "commit_sha=${{ github.sha }}"
            "build_timestamp_utc=$timestamp"
          ) | Set-Content "$stage/build-info.txt" -Encoding ascii

          Get-ChildItem -Recurse $stage | Select-Object FullName,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff7-2026-first-korean-glyph-poc-windows-x64
          path: artifact/ff7-2026-first-korean-glyph-poc-windows-x64/**
          if-no-files-found: error
