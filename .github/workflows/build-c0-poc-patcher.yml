name: Build menu_ja jafont extension patcher

on:
  workflow_dispatch:
  push:
    paths:
      - "codex-lab/poc_runtime_patch/**"
      - "codex-lab/generated/menu_ja_jafont_ext_tbl_exact/**"
      - "codex-lab/tools/verify_menu_jafont_extension.py"
      - "codex-lab/findings/poc_patch_sites.csv"
      - "codex-lab/findings/menu_ja_jafont_extension_assets.md"
      - "ff7K(PC).tbl"
      - ".github/workflows/build-c0-poc-patcher.yml"
  pull_request:
    paths:
      - "codex-lab/poc_runtime_patch/**"
      - "codex-lab/generated/menu_ja_jafont_ext_tbl_exact/**"
      - "codex-lab/tools/verify_menu_jafont_extension.py"
      - "codex-lab/findings/poc_patch_sites.csv"
      - "codex-lab/findings/menu_ja_jafont_extension_assets.md"
      - "ff7K(PC).tbl"
      - ".github/workflows/build-c0-poc-patcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify complete C0-CC font asset set
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile codex-lab/tools/verify_menu_jafont_extension.py
          python codex-lab/tools/verify_menu_jafont_extension.py
          if ($LASTEXITCODE -ne 0) {
            throw "Font asset verification failed with exit code $LASTEXITCODE"
          }

      - name: Build x64 Release patcher
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          if not exist "%VSWHERE%" (
            echo vswhere.exe was not found.
            exit /b 1
          )
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL (
            echo Visual Studio with MSVC x64 tools was not found.
            exit /b 1
          )
          if exist "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" (
            call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          ) else (
            call "%VSINSTALL%\VC\Auxiliary\Build\vcvars64.bat"
          )
          if errorlevel 1 exit /b %errorlevel%
          where cl.exe || exit /b 1
          where link.exe || exit /b 1
          call codex-lab\poc_runtime_patch\build_msvc_x64.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Verify executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = "codex-lab/poc_runtime_patch/c0_poc_patcher.exe"
          if (!(Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Expected executable was not produced: $exe"
          }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -le 0) {
            throw "Expected executable has zero size: $exe"
          }
          Write-Host "Verified $exe ($($item.Length) bytes)"

      - name: Stage artifact files
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $stage = "artifact/ff7-2026-menu-ja-jafont-extension-windows-x64"
          if (Test-Path -LiteralPath $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/generated/menu_ja_jafont_ext_tbl_exact" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/findings" | Out-Null
          Copy-Item -LiteralPath "codex-lab/poc_runtime_patch/c0_poc_patcher.exe" -Destination $stage
          Copy-Item -LiteralPath "codex-lab/poc_runtime_patch/README.md" -Destination $stage
          foreach ($n in 7..19) {
            $source = "codex-lab/generated/menu_ja_jafont_ext_tbl_exact/jafont_$n.tex"
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing TEX page while staging: $source"
            }
            Copy-Item -LiteralPath $source -Destination "$stage/generated/menu_ja_jafont_ext_tbl_exact/"
          }
          foreach ($name in @("menu_jafont_extension_mapping.csv", "menu_jafont_extension_mapping.json", "README.md", "menu_jafont_extension_duplicates.csv")) {
            $source = "codex-lab/generated/menu_ja_jafont_ext_tbl_exact/$name"
            if (!(Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Missing generated metadata while staging: $source"
            }
            Copy-Item -LiteralPath $source -Destination "$stage/generated/menu_ja_jafont_ext_tbl_exact/"
          }
          foreach ($source in @("codex-lab/findings/poc_patch_sites.csv", "codex-lab/findings/menu_ja_jafont_extension_assets.md", "codex-lab/findings/first_korean_glyph_test_vector.md")) {
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination "$stage/findings/"
            }
          }
          $timestamp = (Get-Date).ToUniversalTime().ToString("o")
          @(
            "commit_sha=${{ github.sha }}"
            "build_timestamp_utc=$timestamp"
            "encoding_pages=C0-CC"
            "font_pages=jafont_7.tex-jafont_19.tex"
          ) | Set-Content -LiteralPath "$stage/build-info.txt" -Encoding ascii
          $stagedTex = Get-ChildItem -LiteralPath "$stage/generated/menu_ja_jafont_ext_tbl_exact" -Filter "jafont_*.tex"
          if ($stagedTex.Count -ne 13) {
            throw "Staged TEX page count is $($stagedTex.Count), expected 13"
          }
          Get-ChildItem -LiteralPath $stage -Recurse | Select-Object FullName, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff7-2026-menu-ja-jafont-extension-windows-x64
          path: artifact/ff7-2026-menu-ja-jafont-extension-windows-x64/**
          if-no-files-found: error
          retention-days: 14
