name: Build field-only native-lead patcher

on:
  workflow_dispatch:
  push:
    paths:
      - "codex-lab/poc_runtime_patch/**"
      - "codex-lab/tools/build_compact_patcher_source.py"
      - ".github/workflows/build-c0-poc-patcher.yml"
  pull_request:
    paths:
      - "codex-lab/poc_runtime_patch/**"
      - "codex-lab/tools/build_compact_patcher_source.py"
      - ".github/workflows/build-c0-poc-patcher.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate source
        shell: pwsh
        run: |
          python -m py_compile codex-lab/tools/build_compact_patcher_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python codex-lab/tools/build_compact_patcher_source.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $p = "codex-lab/poc_runtime_patch/c0_poc_patcher_compact.cpp"
          if (!(Test-Path $p)) { throw "generated source missing" }
          $s = Get-Content $p -Raw
          foreach ($x in @("field_render_scanner_prefix","field_layout_scanner_prefix","glyph_renderer_c0_page_select","jafont_7.tim .. jafont_12.tim")) {
            if (!$s.Contains($x)) { throw "missing marker: $x" }
          }
          foreach ($x in @("common_render_scanner_prefix","common_width_scanner_prefix","jafont_13.tim","jafont_19.tim")) {
            if ($s.Contains($x)) { throw "forbidden marker: $x" }
          }

      - name: Build x64
        shell: cmd
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq delims=" %%i in (`"%VSWHERE%" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VSINSTALL=%%i"
          if not defined VSINSTALL exit /b 1
          call "%VSINSTALL%\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b %errorlevel%
          call codex-lab\poc_runtime_patch\build_msvc_x64.bat
          if errorlevel 1 exit /b %errorlevel%

      - name: Stage
        shell: pwsh
        run: |
          $out = "artifact/field-only"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "codex-lab/poc_runtime_patch/c0_poc_patcher.exe" $out
          Copy-Item "codex-lab/poc_runtime_patch/README.md" $out
          @(
            "new_leads=C0-C5",
            "added_pages=jafont_7-jafont_12",
            "hooks=loader,field_render,field_layout,glyph_renderer",
            "excluded=common_render,common_width"
          ) | Set-Content "$out/build-info.txt" -Encoding ascii

      - uses: actions/upload-artifact@v4
        with:
          name: ff7-2026-field-only-native-lead-patcher-windows-x64
          path: artifact/field-only/**
          if-no-files-found: error
