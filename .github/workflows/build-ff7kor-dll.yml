name: Build ff7kor DLL

on:
  workflow_dispatch:
  push:
    paths:
      - "ff7kor-dll/**"
      - ".github/workflows/build-ff7kor-dll.yml"

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Verify toolchain
        shell: cmd
        run: |
          where cl
          where link
          cl /? >nul
          link /? >nul

      - name: Build x86 DLL
        shell: cmd
        run: |
          call ff7kor-dll\build_msvc_win32_cl.bat

      - name: Verify DLL artifact exists
        shell: cmd
        run: |
          if not exist ff7kor-dll\build-msvc-win32-cl\ff7kor.dll exit /b 1
          dir ff7kor-dll\build-msvc-win32-cl\ff7kor.dll

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ff7kor-dll-win32
          path: ff7kor-dll/build-msvc-win32-cl/ff7kor.dll
          if-no-files-found: error
